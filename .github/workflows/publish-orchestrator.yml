name: CI / Publish


on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build orch-ui
              run: npm run build --workspace=packages/orch-ui

            - name: Build orch-app
              run: npm run build --workspace=packages/orch-app

            - name: Copy orch-app to orch-server public
              run: npm run copy-app --workspace=packages/orch-server

            - name: Build orch-server
              run: npm run build --workspace=packages/orch-server

            - name: Build TypeScript
              run: npm run build --workspace=packages/orchestrator-cli

            - name: Build Go launchers
              run: npm run build-launcher --workspace=packages/orchestrator-cli

            - name: Build tray binary
              run: npm run build-tray --workspace=packages/orchestrator-cli

            - name: Run tests
              run: npm test --workspace=packages/orchestrator-cli --workspace=packages/orch-server --if-present

    publish:
        needs: build-and-test
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build orch-ui
              run: npm run build --workspace=packages/orch-ui

            - name: Build orch-app
              run: npm run build --workspace=packages/orch-app

            - name: Copy orch-app to orch-server public
              run: npm run copy-app --workspace=packages/orch-server

            - name: Build orch-server
              run: npm run build --workspace=packages/orch-server

            - name: Build TypeScript
              run: npm run build --workspace=packages/orchestrator-cli

            - name: Build Go launchers
              run: npm run build-launcher --workspace=packages/orchestrator-cli

            - name: Build tray binary
              run: npm run build-tray --workspace=packages/orchestrator-cli

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            - name: Generate platform package directories
              run: bash packages/orchestrator-cli/ci/scripts/generate-platform-packages.sh

            - name: Copy binaries to platform packages
              run: bash packages/orchestrator-cli/ci/scripts/copy-binaries.sh

            - name: Set version in platform packages
              run: |
                  for pkg in orchestrator-cli-win32-x64 orchestrator-cli-darwin-arm64 orchestrator-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm pkg set version="${{ steps.version.outputs.version }}")
                  done

            - name: Publish platform packages
              run: |
                  for pkg in orchestrator-cli-win32-x64 orchestrator-cli-darwin-arm64 orchestrator-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ steps.version.outputs.dist_tag }})
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Set version
              run: npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/orchestrator-cli

            - name: Bundle updater
              run: npm run bundle-updater --workspace=packages/orchestrator-cli

            - name: Publish
              run: npm publish --workspace=packages/orchestrator-cli --tag ${{ steps.version.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
