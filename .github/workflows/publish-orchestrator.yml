name: CI / Publish


on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

# Back-to-back pushes used to run fully in parallel and compete for runners. That is a plausible
# contributor to the flakiness seen on 2026-09-19: a macOS leg died with `spawn esbuild EAGAIN`
# (process exhaustion, not an assertion) and an ubuntu leg ended with its `Run tests` step never
# recording a completion and its logs returning 404.
#
# cancel-in-progress is deliberately NOT true on main. The `publish` job runs `npm publish`, and
# cancelling that mid-flight risks a half-published version, which is far worse than a slow queue.
# So main pushes serialise and pull requests cancel their own superseded runs.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build-and-test:
        # The published targets are win32-x64, darwin-arm64, darwin-x64, linux-x64 and linux-arm64. This
        # job once ran on ubuntu alone, so every Windows and
        # macOS path was untested: the registry entries, taskkill, the generated
        # VBScript, the launchd plist, launchctl, the MSYS2 detach behaviour. None of the
        # regressions shipped on 2026-09-15 could have been caught here.
        # publish stays on ubuntu alone: build.sh cross-compiles every target via
        # GOOS/GOARCH, so matrixing it would publish the same version three times.
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        # Fixed paths so one cache key works on all three runners, where `go env GOCACHE` otherwise
        # points somewhere different per OS.
        env:
            GOCACHE: ${{ github.workspace }}/.gocache
            GOMODCACHE: ${{ github.workspace }}/.gomodcache
        defaults:
            run:
                # windows-latest defaults to PowerShell, where the POSIX steps below (mkdir -p,
                # cp -r, bash scripts) do not exist. Git Bash ships on the runner.
                shell: bash
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'
                  cache: npm

            # Patch-pinned: a new Go patch changes every native binary's hash, which republishes the
            # three platform packages on its own and moves the exact pin a rollback needs. Bumping
            # this is deliberate, and republishes them once.
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26.8'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # orch-core (the logic orch-server and the module share) has no build of its own: both controllers
            # bundle its TypeScript sources. This is the only place its types are checked on their own, apart
            # from the checks each controller makes when it consumes them.
            - name: Typecheck orch-core
              run: npm run typecheck --workspace=packages/orch-core

            # orch-app and the module import the components from dsl-lib-orch sources, so there is nothing to
            # compile first. This step keeps what the former component-package build gave CI: a type error in a
            # component fails here, before the SPA build.
            - name: Typecheck dsl-lib-orch
              run: npm run typecheck --workspace=packages/dsl-lib-orch

            # 57s on the Windows runner, and dashboard-server.test.js asserts the SPA is served, so it
            # cannot simply be skipped there. Cached on its inputs instead. No runner.os in the key:
            # the output is static assets, so one build serves all three runners.
            - name: Cache the built SPA
              id: spa-cache
              uses: actions/cache@v4
              with:
                  path: packages/orch-app/dist
                  key: spa-${{ hashFiles('package-lock.json', 'packages/orch-app/src/**', 'packages/orch-app/index.html', 'packages/orch-app/vite.config.ts', 'packages/orch-app/package.json', 'packages/dsl-lib-orch/src/**', 'packages/dsl-lib-orch/package.json') }}

            - name: Build orch-app
              if: steps.spa-cache.outputs.cache-hit != 'true'
              run: npm run build --workspace=packages/orch-app

            # orch-app's `build` is `vite build && patch-entries && tsc --noEmit`, so skipping it on a
            # cache hit would skip the typecheck too. Same verification on both paths.
            - name: Typecheck orch-app
              if: steps.spa-cache.outputs.cache-hit == 'true'
              run: npm run typecheck --workspace=packages/orch-app

            - name: Copy orch-app to orch-server public
              run: npm run copy-app --workspace=packages/orch-server

            - name: Build orch-server
              run: npm run build --workspace=packages/orch-server

            - name: Bundle orch-server into orchestrator-cli
              run: |
                  mkdir -p packages/orchestrator-cli/server
                  cp -r packages/orch-server/dist packages/orchestrator-cli/server/dist
                  cp -r packages/orch-server/public packages/orchestrator-cli/server/public

            # The dashboard as an app-core module: its components and stylesheet (dsl-lib), its backend
            # and its pages. The daemon registers the PACKAGED folder (dist-module) with app-core at every
            # start. `package` builds the stylesheet first (Tailwind), then runs app-core-cli, which checks
            # the layout again, bundles the backend and the components and stamps BUNDLE_VERSION into the manifest.
            # No version is computed in this job (it publishes nothing), so the manifest carries a placeholder.
            - name: Build the app-core module
              run: |
                  npm run check --workspace=packages/app-module-orchestrator
                  npm run package --workspace=packages/app-module-orchestrator
              env:
                  BUNDLE_VERSION: 0.0.0-ci

            - name: Bundle the app-core module into orchestrator-cli
              run: bash packages/orchestrator-cli/ci/scripts/copy-app-module.sh

            - name: Build TypeScript
              run: npm run build --workspace=packages/orchestrator-cli

            # 57s uncached, 2.2s warm. Three local builds -- warm, cold and a third -- gave identical
            # hashes, so the cache cannot change what gets published.
            # setup-go's own cache is unusable here: it keys on a go.sum that lives in node_modules,
            # which does not exist yet when setup-go runs.
            - name: Cache the Go build
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ github.workspace }}/.gocache
                      ${{ github.workspace }}/.gomodcache
                  key: go-${{ runner.os }}-1.26.8-${{ hashFiles('packages/orchestrator-cli/package.json') }}

            - name: Build Go launchers
              run: npm run build-launcher --workspace=packages/orchestrator-cli

            - name: Build tray binary
              run: npm run build-tray --workspace=packages/orchestrator-cli

            - name: Build supervisor binary
              run: npm run build-supervisor --workspace=packages/orchestrator-cli

            # The launcher is what start-at-login depends on, and its bundle resolution had no
            # coverage in this repo at all. go.mod sits inside go-launcher, so that is the module
            # root: running from the package above it fails with "does not contain main module".
            - name: Run Go launcher tests
              run: go test ./...
              working-directory: node_modules/@wadeck-app/singleton-daemon-kit/go-launcher

            # The per-job supervisor: its tests run the real binary logic against node, so the unix process
            # group and the Windows taskkill paths are each exercised on their own platform.
            - name: Run supervisor tests
              run: go test ./...
              working-directory: packages/orchestrator-cli/supervisor-go

            # Evidence, not a fix. A macOS leg has repeatedly died in `Run tests` with
            # `spawn <node> EAGAIN` (the process table was full when the test runner tried to start a
            # test file), on a different push each time and never on ubuntu or windows. Who held the
            # processes was never recorded, so this samples the process table during the tests and the
            # step after them prints the limits, the peak, and what was still alive.
            # Ubuntu joined in after run 419: the whole orchestrator-cli test run was interrupted
            # ("Interrupted while running", 47 files cancelled), the same silent symptom as the exec-manager
            # failure of run 394, and the rerun passed.
            - name: Watch the process table
              if: runner.os != 'Windows'
              run: bash packages/orchestrator-cli/ci/scripts/proc-watch.sh start

            # dsl-lib-orch holds both suites (components under src/, the DSL adapter under test/); they run as
            # two vitest projects in one invocation.
            - name: Run tests
              # Evidence, not a fix (ubuntu only), for the runs where the orchestrator-cli test run is killed
              # (run 419 "Interrupted while running", run 421 "Terminated" / exit 143), both about five seconds
              # after test/detach-exit.test.js passed. Two sources, printed by the report step below:
              #   - strace records every kill/tkill/tgkill made by any process of the suite (the Go supervisor
              #     included) with its sender and target; --seccomp-bpf makes tracing only those calls nearly free;
              #   - signal-trace.cjs, preloaded into every node process, records the node kills aimed at a group,
              #     at init or at a parent, with the caller's stack.
              env:
                  NODE_OPTIONS: ${{ runner.os == 'Linux' && format('--require {0}/packages/orchestrator-cli/ci/scripts/signal-trace.cjs', github.workspace) || '' }}
                  SIGNAL_TRACE_LOG: ${{ runner.temp }}/signal-trace.log
                  KILL_TRACE_LOG: ${{ runner.temp }}/kill-trace.txt
              run: |
                  npm test --workspace=packages/orch-core --if-present
                  npm test --workspace=packages/orch-server --if-present
                  npm test --workspace=packages/dsl-lib-orch --if-present
                  npm test --workspace=packages/app-module-orchestrator --if-present
                  if [ "$RUNNER_OS" = "Linux" ]; then
                      command -v strace >/dev/null || sudo apt-get install -y strace
                      # -D: the tracer is a detached grandchild, so the step ends with npm. Without it strace waits for
                      # every traced descendant, and the processes some tests leave behind (see the process table
                      # report) held run 423 until the step timeout although all 958 tests had passed.
                      strace -D -f -qq --seccomp-bpf -e trace=kill,tkill,tgkill -o "$KILL_TRACE_LOG" npm test --workspace=packages/orchestrator-cli --if-present
                  else
                      npm test --workspace=packages/orchestrator-cli --if-present
                  fi
              # The orchestrator-cli suite was disabled here as "extremely slow (7+ min hang)".
              # It was not slow: ExecManager.stop() never killed the process trees it started,
              # so every run leaked a node fixture, some of which ignore SIGTERM by design, and
              # the runner waited forever on children that could not exit. With the trees torn
              # down the whole suite finishes in about a minute (measured 2026-10-18: 66s macOS, 69s ubuntu, 2min windows), so it belongs back in CI: several
              # regressions shipped on 2026-09-15 would have been caught here.
              #
              # 10 minutes, for the five suites together. The limit was 5 while the Windows leg took 4m02 to 4m43
              # (runs 435-436, 3e369e1); run d1b2cb4 was cut at 5:00 with no test failing and tests still running
              # (the last result was logged at 4:06, then nothing until the runner's ^C). A hung test is caught by
              # the per-test --test-timeout=120000 of npm test, so this limit only has to hold the sum.
              timeout-minutes: 10

            - name: Report the process table (tests failed)
              if: failure() && runner.os != 'Windows'
              run: bash packages/orchestrator-cli/ci/scripts/proc-watch.sh dump

            # What the machine said while the tests ran: every kill syscall and every signal received, with the
            # sender's pid in si_pid (liveness checks, SIGCHLD, and the SIGURG the Go runtime sends itself all the
            # time, left out), the suspicious node kills, the
            # memory, and the kernel log (an out-of-memory kill would show there). A source that cannot be read
            # is said so, not skipped.
            - name: Report the signals (ubuntu, tests failed)
              if: failure() && runner.os == 'Linux'
              run: |
                  echo "--- kill syscalls, sender pid first (strace), last 300"
                  if [ -f "$KILL_TRACE_LOG" ]; then grep -E '(kill|tkill|tgkill)\(|--- SIG' "$KILL_TRACE_LOG" | grep -v -E 'SIGURG|SIGCHLD|, 0\)' | tail -300; else echo "no kill trace: strace did not run"; fi
                  echo "--- signal-trace.log (node kills at a group, init or a parent)"
                  if [ -f "$SIGNAL_TRACE_LOG" ]; then cat "$SIGNAL_TRACE_LOG"; else echo "empty: no such kill was recorded"; fi
                  echo "--- memory"
                  free -m
                  echo "--- kernel log (last 40 lines)"
                  sudo -n dmesg 2>&1 | tail -40
              env:
                  SIGNAL_TRACE_LOG: ${{ runner.temp }}/signal-trace.log
                  KILL_TRACE_LOG: ${{ runner.temp }}/kill-trace.txt

    publish:
        needs: build-and-test
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        env:
            GOCACHE: ${{ github.workspace }}/.gocache
            GOMODCACHE: ${{ github.workspace }}/.gomodcache
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'
                  cache: npm

            # Patch-pinned: a new Go patch changes every native binary's hash, which republishes the
            # three platform packages on its own and moves the exact pin a rollback needs. Bumping
            # this is deliberate, and republishes them once.
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26.8'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Same key as build-and-test, so this restores the very bytes that job already built and
            # tested -- and since publish `needs: build-and-test`, the entry is always populated by
            # the time this runs. This was the last 36-42s of SPA rebuild left in the pipeline.
            #
            # restore-only rather than the full cache action, because build-and-test has already
            # saved this key in this same run and a save here would only warn that it exists.
            # On a miss the build step below still runs, so a cold cache cannot block a release.
            - name: Restore the built SPA
              id: spa-cache
              uses: actions/cache/restore@v4
              with:
                  path: packages/orch-app/dist
                  key: spa-${{ hashFiles('package-lock.json', 'packages/orch-app/src/**', 'packages/orch-app/index.html', 'packages/orch-app/vite.config.ts', 'packages/orch-app/package.json', 'packages/dsl-lib-orch/src/**', 'packages/dsl-lib-orch/package.json') }}

            # No Typecheck counterpart here, unlike build-and-test: that job has already typechecked
            # this exact input on all three platforms, and publish cannot start until it passed.
            - name: Build orch-app
              if: steps.spa-cache.outputs.cache-hit != 'true'
              run: npm run build --workspace=packages/orch-app

            - name: Copy orch-app to orch-server public
              run: npm run copy-app --workspace=packages/orch-server

            - name: Build orch-server
              run: npm run build --workspace=packages/orch-server

            - name: Bundle orch-server into orchestrator-cli
              run: |
                  mkdir -p packages/orchestrator-cli/server
                  cp -r packages/orch-server/dist packages/orchestrator-cli/server/dist
                  cp -r packages/orch-server/public packages/orchestrator-cli/server/public

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            # The dashboard as an app-core module: its components and stylesheet (dsl-lib), its backend
            # and its pages. The daemon registers the PACKAGED folder (dist-module) with app-core at every
            # start. `package` builds the stylesheet first (Tailwind), then runs app-core-cli, which checks
            # the layout again, bundles the backend and the components and stamps BUNDLE_VERSION into the manifest.
            # The version is computed above (it used to come after the builds) so the manifest the daemon
            # registers carries the version being published, not a placeholder.
            - name: Build the app-core module
              run: |
                  npm run check --workspace=packages/app-module-orchestrator
                  npm run package --workspace=packages/app-module-orchestrator
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Bundle the app-core module into orchestrator-cli
              run: bash packages/orchestrator-cli/ci/scripts/copy-app-module.sh

            - name: Build TypeScript
              run: npm run build --workspace=packages/orchestrator-cli

            # 57s uncached, 2.2s warm. Three local builds -- warm, cold and a third -- gave identical
            # hashes, so the cache cannot change what gets published.
            # setup-go's own cache is unusable here: it keys on a go.sum that lives in node_modules,
            # which does not exist yet when setup-go runs.
            - name: Cache the Go build
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ github.workspace }}/.gocache
                      ${{ github.workspace }}/.gomodcache
                  key: go-${{ runner.os }}-1.26.8-${{ hashFiles('packages/orchestrator-cli/package.json') }}

            - name: Build Go launchers
              run: npm run build-launcher --workspace=packages/orchestrator-cli

            - name: Build tray binary
              run: npm run build-tray --workspace=packages/orchestrator-cli

            - name: Build supervisor binary
              run: npm run build-supervisor --workspace=packages/orchestrator-cli

            # Must run BEFORE the bundle step: esbuild inlines require('../package.json'),
            # so bundling first would freeze the version reported by the daemon and the CLI.
            - name: Set version
              run: npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/orchestrator-cli

            - name: Bundle orchestrator CJS
              run: npm run bundle --workspace=packages/orchestrator-cli
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: bash packages/orchestrator-cli/ci/scripts/generate-platform-packages.sh

            - name: Copy native binaries to platform packages
              run: bash packages/orchestrator-cli/ci/scripts/copy-binaries.sh

            # Publishes a platform package only when its binaries changed, then pins the
            # exact resolved versions into the main package's optionalDependencies.
            - name: Publish platform packages (only if binaries changed) and pin them
              run: |
                  bash packages/orchestrator-cli/ci/scripts/publish-platform-packages.sh \
                    "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.dist_tag }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish
              run: npm publish --workspace=packages/orchestrator-cli --tag ${{ steps.version.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
