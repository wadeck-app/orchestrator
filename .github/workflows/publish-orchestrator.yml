name: CI / Publish


on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

# Back-to-back pushes used to run fully in parallel and compete for runners. That is a plausible
# contributor to the flakiness seen on 2026-09-19: a macOS leg died with `spawn esbuild EAGAIN`
# (process exhaustion, not an assertion) and an ubuntu leg ended with its `Run tests` step never
# recording a completion and its logs returning 404.
#
# cancel-in-progress is deliberately NOT true on main. The `publish` job runs `npm publish`, and
# cancelling that mid-flight risks a half-published version, which is far worse than a slow queue.
# So main pushes serialise and pull requests cancel their own superseded runs.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build-and-test:
        # The published targets are win32-x64, darwin-arm64 and darwin-x64, yet this job only
        # ever ran on ubuntu -- the one platform nothing is published for. Every Windows and
        # macOS path was therefore untested: the registry entries, taskkill, the generated
        # VBScript, the launchd plist, launchctl, the MSYS2 detach behaviour. None of the
        # regressions shipped on 2026-09-15 could have been caught here.
        # publish stays on ubuntu alone: build.sh cross-compiles all three targets via
        # GOOS/GOARCH, so matrixing it would publish the same version three times.
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        # Fixed paths so one cache key works on all three runners, where `go env GOCACHE` otherwise
        # points somewhere different per OS.
        env:
            GOCACHE: ${{ github.workspace }}/.gocache
            GOMODCACHE: ${{ github.workspace }}/.gomodcache
        defaults:
            run:
                # windows-latest defaults to PowerShell, where the POSIX steps below (mkdir -p,
                # cp -r, bash scripts) do not exist. Git Bash ships on the runner.
                shell: bash
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'
                  cache: npm

            # Patch-pinned: a new Go patch changes every native binary's hash, which republishes the
            # three platform packages on its own and moves the exact pin a rollback needs. Bumping
            # this is deliberate, and republishes them once.
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26.8'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build orch-ui
              run: npm run build --workspace=packages/orch-ui

            # 57s on the Windows runner, and dashboard-server.test.js asserts the SPA is served, so it
            # cannot simply be skipped there. Cached on its inputs instead. No runner.os in the key:
            # the output is static assets, so one build serves all three runners.
            - name: Cache the built SPA
              id: spa-cache
              uses: actions/cache@v4
              with:
                  path: packages/orch-app/dist
                  key: spa-${{ hashFiles('package-lock.json', 'packages/orch-app/src/**', 'packages/orch-app/index.html', 'packages/orch-app/vite.config.ts', 'packages/orch-app/package.json', 'packages/orch-ui/src/**', 'packages/orch-ui/package.json') }}

            - name: Build orch-app
              if: steps.spa-cache.outputs.cache-hit != 'true'
              run: npm run build --workspace=packages/orch-app

            # orch-app's `build` is `vite build && patch-entries && tsc --noEmit`, so skipping it on a
            # cache hit would skip the typecheck too. Same verification on both paths.
            - name: Typecheck orch-app
              if: steps.spa-cache.outputs.cache-hit == 'true'
              run: npm run typecheck --workspace=packages/orch-app

            - name: Copy orch-app to orch-server public
              run: npm run copy-app --workspace=packages/orch-server

            - name: Build orch-server
              run: npm run build --workspace=packages/orch-server

            - name: Bundle orch-server into orchestrator-cli
              run: |
                  mkdir -p packages/orchestrator-cli/server
                  cp -r packages/orch-server/dist packages/orchestrator-cli/server/dist
                  cp -r packages/orch-server/public packages/orchestrator-cli/server/public

            - name: Build TypeScript
              run: npm run build --workspace=packages/orchestrator-cli

            # 57s uncached, 2.2s warm. Three local builds -- warm, cold and a third -- gave identical
            # hashes, so the cache cannot change what gets published.
            # setup-go's own cache is unusable here: it keys on a go.sum that lives in node_modules,
            # which does not exist yet when setup-go runs.
            - name: Cache the Go build
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ github.workspace }}/.gocache
                      ${{ github.workspace }}/.gomodcache
                  key: go-${{ runner.os }}-1.26.8-${{ hashFiles('packages/orchestrator-cli/package.json') }}

            - name: Build Go launchers
              run: npm run build-launcher --workspace=packages/orchestrator-cli

            - name: Build tray binary
              run: npm run build-tray --workspace=packages/orchestrator-cli

            # The launcher is what start-at-login depends on, and its bundle resolution had no
            # coverage in this repo at all. go.mod sits inside go-launcher, so that is the module
            # root: running from the package above it fails with "does not contain main module".
            - name: Run Go launcher tests
              run: go test ./...
              working-directory: node_modules/@wadeck-app/singleton-daemon-kit/go-launcher

            # orch-ui is built here but was never tested, so its 11 test files failed to even
            # load, unnoticed, for as long as they existed: @testing-library/dom is a
            # peerDependency of @testing-library/react v16 and was never declared, and vitest
            # lacked the @dsl-ui alias that @wadeck-app/dsl-ui uses internally. Building a
            # package is not the same as exercising it.
            - name: Run tests
              run: |
                  npm test --workspace=packages/orch-server --if-present
                  npm test --workspace=packages/orch-ui --if-present
                  npm test --workspace=packages/orchestrator-cli --if-present
              # The orchestrator-cli suite was disabled here as "extremely slow (7+ min hang)".
              # It was not slow: ExecManager.stop() never killed the process trees it started,
              # so every run leaked a node fixture, some of which ignore SIGTERM by design, and
              # the runner waited forever on children that could not exit. With the trees torn
              # down the whole suite finishes in ~13s, so it belongs back in CI: several
              # regressions shipped on 2026-09-15 would have been caught here.
              timeout-minutes: 5

    publish:
        needs: build-and-test
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        env:
            GOCACHE: ${{ github.workspace }}/.gocache
            GOMODCACHE: ${{ github.workspace }}/.gomodcache
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'
                  cache: npm

            # Patch-pinned: a new Go patch changes every native binary's hash, which republishes the
            # three platform packages on its own and moves the exact pin a rollback needs. Bumping
            # this is deliberate, and republishes them once.
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26.8'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build orch-ui
              run: npm run build --workspace=packages/orch-ui

            # Same key as build-and-test, so this restores the very bytes that job already built and
            # tested -- and since publish `needs: build-and-test`, the entry is always populated by
            # the time this runs. This was the last 36-42s of SPA rebuild left in the pipeline.
            #
            # restore-only rather than the full cache action, because build-and-test has already
            # saved this key in this same run and a save here would only warn that it exists.
            # On a miss the build step below still runs, so a cold cache cannot block a release.
            - name: Restore the built SPA
              id: spa-cache
              uses: actions/cache/restore@v4
              with:
                  path: packages/orch-app/dist
                  key: spa-${{ hashFiles('package-lock.json', 'packages/orch-app/src/**', 'packages/orch-app/index.html', 'packages/orch-app/vite.config.ts', 'packages/orch-app/package.json', 'packages/orch-ui/src/**', 'packages/orch-ui/package.json') }}

            # No Typecheck counterpart here, unlike build-and-test: that job has already typechecked
            # this exact input on all three platforms, and publish cannot start until it passed.
            - name: Build orch-app
              if: steps.spa-cache.outputs.cache-hit != 'true'
              run: npm run build --workspace=packages/orch-app

            - name: Copy orch-app to orch-server public
              run: npm run copy-app --workspace=packages/orch-server

            - name: Build orch-server
              run: npm run build --workspace=packages/orch-server

            - name: Bundle orch-server into orchestrator-cli
              run: |
                  mkdir -p packages/orchestrator-cli/server
                  cp -r packages/orch-server/dist packages/orchestrator-cli/server/dist
                  cp -r packages/orch-server/public packages/orchestrator-cli/server/public

            - name: Build TypeScript
              run: npm run build --workspace=packages/orchestrator-cli

            # 57s uncached, 2.2s warm. Three local builds -- warm, cold and a third -- gave identical
            # hashes, so the cache cannot change what gets published.
            # setup-go's own cache is unusable here: it keys on a go.sum that lives in node_modules,
            # which does not exist yet when setup-go runs.
            - name: Cache the Go build
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ github.workspace }}/.gocache
                      ${{ github.workspace }}/.gomodcache
                  key: go-${{ runner.os }}-1.26.8-${{ hashFiles('packages/orchestrator-cli/package.json') }}

            - name: Build Go launchers
              run: npm run build-launcher --workspace=packages/orchestrator-cli

            - name: Build tray binary
              run: npm run build-tray --workspace=packages/orchestrator-cli

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            # Must run BEFORE the bundle step: esbuild inlines require('../package.json'),
            # so bundling first would freeze the version reported by the daemon and the CLI.
            - name: Set version
              run: npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/orchestrator-cli

            - name: Bundle orchestrator CJS
              run: npm run bundle --workspace=packages/orchestrator-cli
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: bash packages/orchestrator-cli/ci/scripts/generate-platform-packages.sh

            - name: Copy native binaries to platform packages
              run: bash packages/orchestrator-cli/ci/scripts/copy-binaries.sh

            # Publishes a platform package only when its binaries changed, then pins the
            # exact resolved versions into the main package's optionalDependencies.
            - name: Publish platform packages (only if binaries changed) and pin them
              run: |
                  bash packages/orchestrator-cli/ci/scripts/publish-platform-packages.sh \
                    "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.dist_tag }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish
              run: npm publish --workspace=packages/orchestrator-cli --tag ${{ steps.version.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
