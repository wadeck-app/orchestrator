name: Publish @wadeck-app/orchestrator

env:
    GITHUB_NPM_REGISTRY_PATH: //npm.pkg.github.com/

on:
    push:
        branches: [main]
        paths:
            - 'src/**'
            - 'test/**'
            - 'bin/**'
            - 'launcher-go/**'
            - 'tray-go/**'
            - 'package.json'
            - '.github/workflows/publish-orchestrator.yml'
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Install dependencies
              run: npm install --prefer-offline

            - name: Build TypeScript
              run: npm run build

            - name: Build Go launchers
              run: npm run build-launcher

            - name: Build tray binary
              run: npm run build-tray

            - name: Run tests
              run: npm test

            - name: Compute version
              id: version
              run: bash ci/scripts/compute-version.sh
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  VERSION_INPUT: ${{ github.event.inputs.version }}
                  BREAKING_INPUT: ${{ github.event.inputs.breaking }}

            - name: Set version
              run: npm pkg set version="${{ steps.version.outputs.version }}"

            - name: Bundle updater
              run: npm run bundle-updater

            - name: Configure GitHub Packages registry
              run: |
                  echo "@wadeck-app:registry=https:${GITHUB_NPM_REGISTRY_PATH}" >> ~/.npmrc
                  echo "${GITHUB_NPM_REGISTRY_PATH}:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish
              run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
