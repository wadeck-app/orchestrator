$sources:
  jobData:
    url: GET /api/modules/orchestrator/api/jobs/{id}
    params:
      id: $route.id

$type: PageContent
# The shell stops constraining the width, because on this page the width is the reader's choice: the
# Wide/Narrow toggle in the pane's toolbar remembers it. Both sections below apply that choice
# themselves, so they stay aligned with each other instead of with the shell.
maxWidth: full
sections:
  # No back link or title row: the shell's breadcrumb above the page (Orchestrator > Jobs > Job > Job logs) is the
  # way back, and the height such a row would take goes to the log pane (`fill`).
  - $type: orchestrator:LogViewer
    jobId: $route.id
    fill: true
