$sources:
  jobData:
    url: GET /api/modules/orchestrator/api/jobs/{id}
    params:
      id: $route.id

$brains:
  updateJob:
    $brain: $brains.$http.put
    url: PUT /api/modules/orchestrator/api/jobs/{id}
    body: $outputs.jobForm.onSubmit
    $outputs: [id]
  # To the list, not back to the job: the same destination as a create, so saving a job always
  # lands in the same place. Waiting on $brains.updateJob.id is what could never fire before.
  navigateAfterUpdate:
    $brain: $brains.$ctx.navigate
    to: /modules/orchestrator/
    id: $brains.updateJob.id
  navigateCancel:
    $brain: $brains.$ctx.navigate
    to: /modules/orchestrator/jobs/{id}
    _event: $outputs.jobForm.onCancel

$type: PageContent
sections:
  - $type: orchestrator:MutationFeedback
    pending: $brains.updateJob.$pending
    error: $brains.updateJob.$error
    successMessage: Job saved
  - $type: orchestrator:JobFormSection
    $id: jobForm
    jobId: $route.id
    initial: $sources.jobData
    saving: $brains.updateJob.$pending
    $outputs:
      onSubmit: [formData]
      onCancel: []
