# The three numbers the navbar stats show, from the same /api/health, for the dashboard widget.
$sources:
  health:
    url: GET /api/modules/orchestrator/api/health
    poll: 30s

# Stacked, not side by side: a dashboard cell is about 270px wide and HorizontalStack cannot wrap, so
# the third tile was cut off by the card's edge.
$type: VerticalStack
gap: gap-2
items:
  - $type: StatTile
    label: Jobs
    value: $sources.health.totalJobs
  - $type: StatTile
    label: Running
    value: $sources.health.runningJobs
  - $type: StatTile
    label: Recent failures
    value: $sources.health.recentFailures
