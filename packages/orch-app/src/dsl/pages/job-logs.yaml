$route: /jobs/:id/logs

$sources:
  jobData:
    url: GET /api/jobs/{id}
    params:
      id: $route.id

$type: PageContent
# The shell stops constraining the width, because on this page the width is the reader's choice: the
# Wide/Narrow toggle in the pane's toolbar remembers it. Both sections below apply that choice
# themselves, so they stay aligned with each other instead of with the shell.
maxWidth: full
sections:
  # One compact row instead of a BackLink, a text-2xl PageHeader and a redundant
  # "Logs" subtitle stacked over each other: those pushed the first log line to
  # y=243 on a 900px viewport. `fill` hands the reclaimed height to the log pane.
  - $type: LogPageBreadcrumb
    jobId: $route.id
    jobLabel: $sources.jobData.job.label
  - $type: LogViewer
    jobId: $route.id
    fill: true
