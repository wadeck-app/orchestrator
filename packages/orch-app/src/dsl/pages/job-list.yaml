$route: /

$vars:
  search: ""
  filter: "all"

$sources:
  jobs:
    url: GET /api/jobs
    poll: 30s

$brains:
  updateSearch:
    $brain: $brains.$ctx.setVar
    varName: search
    value: $outputs.jobSearchBar.onChange
    _event: $outputs.jobSearchBar.onChange

  updateFilter:
    $brain: $brains.$ctx.setVar
    varName: filter
    value: $outputs.jobFilterChips.onChange
    _event: $outputs.jobFilterChips.onChange

  triggerJob:
    $brain: $brains.$http.post
    url: POST /api/jobs/{id}/trigger
    id: $outputs.jobGrid.onTrigger
    _event: $outputs.jobGrid.onTrigger
    $reload: [jobs]

  toggleJob:
    $brain: $brains.$http.post
    url: POST /api/jobs/{id}/{action}
    id: $outputs.jobGrid.onToggle.id
    action: $outputs.jobGrid.onToggle.action
    _event: $outputs.jobGrid.onToggle
    $reload: [jobs]

  navigateToJob:
    $brain: $brains.$ctx.navigate
    route: /jobs/{id}
    id: $outputs.jobGrid.onJobClick
    _event: $outputs.jobGrid.onJobClick

  navigateToNewJob:
    $brain: $brains.$ctx.navigate
    route: /jobs/new
    _event: $outputs.jobGrid.onAddJob

$type: PageContent
sections:
  - $type: PageHeader
    title: Orchestrator Dashboard
  # Search and filters on one row. They were two stacked sections, each using under a third
  # of the page width, which put 46px of empty band between them for no reason - and split
  # two controls that are read together.
  - $type: HorizontalStack
    gap: gap-4
    align: items-center
    # The slot is `items`, not `children`: the registry entry reads node['items'].
    items:
      # dsl-ui's own search input: adds a search icon, a clear button and role=search that
      # the hand-rolled wrapper this replaced had none of. debounceMs 0 keeps the current
      # filter-per-keystroke behaviour instead of dsl-ui's 300ms default.
      - $type: SearchBar
        $id: jobSearchBar
        value: $vars.search
        placeholder: Search jobs...
        debounceMs: 0
        $outputs:
          onChange: [value]
      - $type: JobFilterChips
        $id: jobFilterChips
        selected: $vars.filter
        $outputs:
          onChange: [selected]
  - $type: JobCardGrid
    $id: jobGrid
    items: $sources.jobs
    search: $vars.search
    filter: $vars.filter
    $outputs:
      onTrigger: [id]
      onToggle: [id, action]
      onJobClick: [id]
      onAddJob: [_]
