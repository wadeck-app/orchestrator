$route: /

$vars:
  search: ""
  filter: "all"

$sources:
  jobs:
    url: GET /api/jobs
    poll: 30s

$brains:
  updateSearch:
    $brain: $brains.$ctx.setVar
    varName: search
    value: $outputs.jobSearchBar.onChange
    _event: $outputs.jobSearchBar.onChange

  updateFilter:
    $brain: $brains.$ctx.setVar
    varName: filter
    value: $outputs.jobFilterChips.onChange
    _event: $outputs.jobFilterChips.onChange

  triggerJob:
    $brain: $brains.$http.post
    url: POST /api/jobs/{id}/trigger
    id: $outputs.jobGrid.onTrigger
    _event: $outputs.jobGrid.onTrigger
    $reload: [jobs]

  toggleJob:
    $brain: $brains.$http.post
    url: POST /api/jobs/{id}/{action}
    id: $outputs.jobGrid.onToggle.id
    action: $outputs.jobGrid.onToggle.action
    _event: $outputs.jobGrid.onToggle
    $reload: [jobs]

  navigateToJob:
    $brain: $brains.$ctx.navigate
    route: /jobs/{id}
    id: $outputs.jobGrid.onJobClick
    _event: $outputs.jobGrid.onJobClick

  navigateToNewJob:
    $brain: $brains.$ctx.navigate
    route: /jobs/new
    _event: $outputs.jobGrid.onAddJob

$type: PageContent
sections:
  - $type: PageHeader
    title: Orchestrator Dashboard
  - $type: JobSearchBar
    $id: jobSearchBar
    value: $vars.search
    $outputs:
      onChange: [value]
  - $type: JobFilterChips
    $id: jobFilterChips
    selected: $vars.filter
    $outputs:
      onChange: [selected]
  - $type: JobCardGrid
    $id: jobGrid
    items: $sources.jobs
    search: $vars.search
    filter: $vars.filter
    $outputs:
      onTrigger: [id]
      onToggle: [id, action]
      onJobClick: [id]
      onAddJob: [_]
