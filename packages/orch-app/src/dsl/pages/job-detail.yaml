$route: /jobs/:id

$sources:
  jobData:
    url: GET /api/jobs/{id}
    params:
      id: $route.id
    poll: 30s

$brains:
  # Run now is posted by the component itself: a job at its concurrency limit answers 200 with a body
  # saying nothing started, which a brain cannot read and would show as a started run.
  reloadAfterTrigger:
    $brain: $brains.$ctx.reload
    _event: $outputs.jobActions.onAfterTrigger
    $reload: [jobData]

  killJob:
    $brain: $brains.$http.post
    url: POST /api/jobs/{id}/kill
    _event: $outputs.jobActions.onKill
    $reload: [jobData]

  deleteJob:
    $brain: $brains.$http.delete
    url: DELETE /api/jobs/{id}
    _event: $outputs.jobActions.onDelete

  navigateAfterDelete:
    $brain: $brains.$ctx.navigate
    to: /
    _event: $outputs.jobActions.onDelete

  navigateViewLogs:
    $brain: $brains.$ctx.navigate
    to: /jobs/{id}/logs
    _event: $outputs.jobActions.onViewLogs

  navigateEdit:
    $brain: $brains.$ctx.navigate
    to: /jobs/{id}/edit
    _event: $outputs.jobActions.onEdit

$type: PageContent
sections:
  - $type: BackLink
    to: /
    label: Back to jobs
  # Reports a kill or a delete the brain could not carry out. Without it the brain's rejection
  # reached only the console: the request failed, the page reloaded, and the reader was told nothing.
  - $type: MutationFeedback
    error: $brains.killJob.$error
  - $type: PageHeader
    title: $sources.jobData.job.label
  - $type: RunningBannerDetail
    $id: jobActions
    jobId: $route.id
    job: $sources.jobData.job
    runHistory: $sources.jobData.runHistory
    # Progress and ETA of the running job, polled with the job (30 s); the component counts down between polls.
    progress: $sources.jobData.progress
    $outputs:
      onAfterTrigger: [_]
      onKill: [_]
      onDelete: [_]
      onViewLogs: [_]
      onEdit: [_]
  - $type: JobConfigDisplay
    job: $sources.jobData.job
  - $type: Section
    title: Run history
    items:
      - $type: RunHistory
        entries: $sources.jobData.runHistory
        # Turns each row into a link to that run's own output. Without it a reader has to open the
        # logs page and re-find the run in the dropdown by matching timestamps by eye.
        jobId: $route.id
        # Set when jobData could not be loaded (daemon down): the table then says it cannot be read instead of "No runs yet".
        # daemon-down-notice.ts relies on this binding to drop the generic banner on this page.
        loadError: $ctx.$sourceErrors.jobData
  # CPU and RAM of the last runs next to the limits each was held to: the answer to "why was it killed?" and to
  # "is its budget still right?". Read on its own from the job id, so it is not part of the polled job source.
  - $type: Section
    title: Resource history
    items:
      - $type: ResourceHistory
        jobId: $route.id
