$route: /jobs/new

$brains:
  submitJob:
    $brain: $brains.$http.post
    url: POST /api/jobs
    body: $outputs.jobForm.onSubmit
    $outputs: [id]
  navigateAfterCreate:
    $brain: $brains.$ctx.navigate
    to: /jobs/{id}
    id: $brains.submitJob.id
  navigateCancel:
    $brain: $brains.$ctx.navigate
    to: /
    _event: $outputs.jobForm.onCancel

$type: PageContent
sections:
  - $type: BackLink
    to: /
    label: Back to jobs
  - $type: JobFormSection
    $id: jobForm
    $outputs:
      onSubmit: [formData]
      onCancel: []
