$route: /audit

$sources:
  auditData:
    url: GET /api/audit?limit=100

$type: PageContent
sections:
  - $type: PageHeader
    title: Audit log
  - $type: Section
    items:
      - $type: AuditList
        entries: $sources.auditData
        # Set when the entries could not be loaded: said instead of a spinner that never ends.
        loadError: $ctx.$sourceErrors.auditData
