$route: /audit

$sources:
  auditData:
    url: GET /api/audit?limit=100

$type: PageContent
sections:
  - $type: PageHeader
    title: Audit log
  - $type: DataTable
    rows: $sources.auditData
    columns:
      - field: event
        label: Event
      - field: ts
        label: Time
        format: datetime
        width: 40
