$route: /schedule

$sources:
  schedule:
    url: GET /api/schedule

$brains:
  # Run early is posted by the timeline itself: a job at its concurrency limit answers 200 with a body
  # saying nothing started (and the scheduled firing is NOT skipped), which a brain cannot read.
  reloadAfterRunEarly:
    $brain: $brains.$ctx.reload
    _event: $outputs.scheduleTimeline.onAfterRunEarly
    $reload: [schedule]

$type: PageContent
sections:
  - $type: PageHeader
    title: Upcoming schedule
  - $type: ScheduleTimeline
    $id: scheduleTimeline
    firings: $sources.schedule
    $outputs:
      onAfterRunEarly: [_]
